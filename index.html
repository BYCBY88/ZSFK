<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>测评</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap:12px;
        }
        .header-left-btn {
            background: rgba(255,255,255,0.32);
            border: 2px solid rgba(255,255,255,0.6);
            box-shadow: 0 0 12px rgba(255,255,255,0.35);
            color: white;
            font-weight:bold;
            padding: 12px 24px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            text-decoration: none;
            white-space: nowrap;
            transition: 0.25s ease;
        }
        .header-left-btn:hover {
            background: rgba(255,255,255,0.45);
            box-shadow: 0 0 18px rgba(255,255,255,0.5);
        }
        .header-middle{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap:10px;
            font-size:15px;
        }
        .user-info button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding:7px 14px;
            border-radius:22px;
            cursor: pointer;
            font-size:14px;
        }
        .user-info button:hover{
            background:rgba(255,255,255,0.32);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap:15px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:12px;
        }
        @media (max-width: 600px) {
            .header {
                padding:14px 12px;
                flex-wrap:wrap;
            }
            .header-left-btn {
                padding:6px 12px;
                font-size:13px;
            }
            .user-info{
                font-size:13px;
            }
            .user-info button{
                padding:5px 10px;
                font-size:12px;
            }
            .form-grid { display:none; }
            .form-row-2 { grid-template-columns: repeat(2,1fr); }
            .form-row-3 { grid-template-columns: repeat(3,1fr); }
        }
        .pc-form { display: grid; grid-template-columns: 1fr 1fr; gap:15px; }
        .mobile-form { display:none; }
        @media (max-width:600px){
            .pc-form { display:none; }
            .mobile-form { display:block; }
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group label .required { color: #e74c3c; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .score-item { margin-bottom: 20px; }
        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .score-label { font-weight: 500; color: #555; }
        .score-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        .score-desc {
            margin-top: 8px;
            padding: 8px 12px;
            background: #fff3cd;
            border-radius: 6px;
            font-size: 12px;
            color: #856404;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .summary-score {
            font-size: 36px;
            font-weight: bold;
        }
        .summary-rating {
            font-size: 24px;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .summary-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 13px;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal h3 { margin-bottom: 15px; color: #333; }
        .modal input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-btn.secondary {
            background: #f0f0f0;
            color: #555;
        }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            max-width:calc(100% - 40px);
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #1dd1a1; }
        .toast.error { background: #ff6b6b; }
        @keyframes slideIn {
            from { opacity: 0; transform:translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform:translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a class="header-left-btn" href="https://bycby88.github.io/CSB/" target="_blank">排行榜</a>
            <div class="header-middle">
                <div class="user-info">
                    <span>测评人：<strong id="nickname-display">用户</strong></span>
                    <button onclick="showNicknameModal()">昵称修改</button>
                </div>
            </div>
        </div>
        <form id="testForm" onsubmit="handleSubmit(event)">
            <div class="card">
                <div class="card-title">📋 基本信息</div>
                <div class="pc-form">
                    <div class="form-group">
                        <label>老师ID <span class="required"></span></label>
                        <input type="text" id="teacherId" placeholder="如@s204386" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>老师姓名 <span class="required"></span></label>
                        <input type="text" id="teacherName" placeholder="输入姓名" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>年龄 <span class="required"></span></label>
                        <input type="number" id="age" min="18" max="60" placeholder="18-60" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>单价 <span class="required"></span></label>
                        <input type="number" id="price" min="3" max="10" placeholder="3-10" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>身高(cm) <span class="required"></span></label>
                        <input type="number" id="height" min="140" max="200" placeholder="140-200" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>体重(斤) <span class="required"></span></label>
                        <input type="number" id="weight" min="40" max="80" step="0.1" placeholder="70-140" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>胸围 <span class="required"></span></label>
                        <select id="bust" required>
                            <option value="">请选择</option>
                            <option value="A-">A-</option>
                            <option value="A">A</option>
                            <option value="A+">A+</option>
                            <option value="B-">B-</option>
                            <option value="B">B</option>
                            <option value="B+">B+</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                </div>
                <div class="mobile-form">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label>老师ID <span class="required"></span></label>
                            <input type="text" id="teacherIdMobile" placeholder="如@s204386" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>老师姓名 <span class="required"></span></label>
                            <input type="text" id="teacherNameMobile" placeholder="输入姓名" required autocomplete="off">
                        </div>
                    </div>
                    <div class="form-row-2">
                        <div class="form-group">
                            <label>单价 <span class="required"></span></label>
                            <input type="number" id="priceMobile" min="3" max="10" placeholder="3-10" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>胸围 <span class="required"></span></label>
                            <select id="bustMobile" required>
                                <option value="">请选择</option>
                                <option value="A-">A-</option>
                                <option value="A">A</option>
                                <option value="A+">A+</option>
                                <option value="B-">B-</option>
                                <option value="B">B</option>
                                <option value="B+">B+</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row-3">
                        <div class="form-group">
                            <label>年龄 <span class="required"></span></label>
                            <input type="number" id="ageMobile" min="18" max="60" placeholder="18‑60" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>身高(cm) <span class="required"></span></label>
                            <input type="number" id="heightMobile" min="140" max="200" placeholder="140‑200" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>体重(斤) <span class="required"></span></label>
                            <input type="number" id="weightMobile" min="70" max="140" step="0.1" placeholder="70‑140" required autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">📊 基础评分（每项权重25%）</div>
                <div class="score-item">
                    <div class="score-header">
                        <span class="score-label">颜值</span>
                        <span class="score-value" id="lookValue">6分</span>
                    </div>
                    <input type="range" id="look" min="1" max="5" step="0.5" value="3" oninput="updateScore('look', this.value)">
                    <div class="score-desc" id="lookDesc">大众脸，不丑不美</div>
                </div>
                <div class="score-item">
                    <div class="score-header">
                        <span class="score-label">胸型</span>
                        <span class="score-value" id="breastValue">6分</span>
                    </div>
                    <input type="range" id="breast" min="1" max="5" step="0.5" value="3" oninput="updateScore('breast', this.value)">
                    <div class="score-desc" id="breastDesc">胸型一般，基本正常</div>
                </div>
                <div class="score-item">
                    <div class="score-header">
                        <span class="score-label">身材</span>
                        <span class="score-value" id="figureValue">6分</span>
                    </div>
                    <input type="range" id="figure" min="1" max="5" step="0.5" value="3" oninput="updateScore('figure', this.value)">
                    <div class="score-desc" id="figureDesc">不胖不瘦，正常身材</div>
                </div>
                <div class="score-item">
                    <div class="score-header">
                        <span class="score-label">服务</span>
                        <span class="score-value" id="serviceValue">6分</span>
                    </div>
                    <input type="range" id="service" min="1" max="5" step="0.5" value="3" oninput="updateScore('service', this.value)">
                    <div class="score-desc" id="serviceDesc">稍有服务，态度积极</div>
                </div>
                <div class="summary">
                    <div class="summary-header">
                        <div>
                            <div style="font-size: 12px; opacity: 0.8;">最终得分</div>
                            <div class="summary-score" id="finalScore">6.00</div>
                        </div>
                    </div>
                    <div class="summary-details">
                        <div>基础分：<span id="baseScore">6.00</span></div>
                        <div>增减分：<span id="extraScore">+0.0</span></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">📝 不足之处与描述</div>
                <div class="form-group">
                    <label>不足之处（填写扣0.2分）</label>
                    <input type="text" id="shortcoming" placeholder="如有明显不足请描述" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>详细描述 <span class="required"></span></label>
                    <textarea id="description" placeholder="描述老师的其他特点、服务体验等...（最多150字）" maxlength="150" required autocomplete="off"></textarea>
                    <div style="text-align: right; font-size: 12px; color: #999; margin-top: 5px;">
                        <span id="descCount">0</span>/150字
                    </div>
                </div>
            </div>
            <button type="submit" class="submit-btn" onclick="handleSubmit(event)">✨ 生成报告并提交</button>
        </form>
    </div>
    <div class="modal-overlay hidden" id="nicknameModal">
        <div class="modal">
            <h3>修改昵称</h3>
            <input type="text" id="nicknameInput" placeholder="请输入昵称" maxlength="20" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeNicknameModal()">取消</button>
                <button class="modal-btn primary" onclick="saveNickname()">保存</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay hidden" id="successModal">
        <div class="modal">
            <h3 style="color: #1dd1a1;">✓ 提交成功</h3>
            <p style="margin: 15px 0; color: #666;">报告已生成并复制到剪贴板</p>
            <div class="modal-buttons">
                <button class="modal-btn primary" onclick="copyAgain()">再次复制</button>
                <button class="modal-btn secondary" onclick="closeSuccessModal()">关闭</button>
            </div>
        </div>
    </div>
<script>
        const state = {
            nickname: '',
            scores: { look: 3, breast: 3, figure: 3, service: 3 }
        };
        // 自动适配PC/移动端取值
        function getVal(pcId, mobileId){
            const pc = document.getElementById(pcId);
            const mob = document.getElementById(mobileId);
            if(window.innerWidth <= 600){
                return mob?.value ?? pc?.value ?? '';
            }else{
                return pc?.value ?? mob?.value ?? '';
            }
        }
        // 移动端兼容复制
        async function safeCopy(text){
            if (!navigator.clipboard){
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position='fixed';
                ta.style.opacity='0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                return true;
            }
            await navigator.clipboard.writeText(text);
            return true;
        }
        const scoreDescs = {
            look: ['丑', '普通偏下', '大众脸，不丑不美', '好看，有辨识度', '惊艳，素颜能打'],
            breast: ['胸型塌陷，影响整体美感', '胸型下垂，注意体态调整', '胸型一般，基本正常', '胸型挺拔，形态良好', '胸型完美，形态极佳'],
            figure: ['太差，没法看', '没腰没臀，平板身材', '不胖不瘦，正常身材', '有腰有臀，曲线明显', '前凸后翘，穿啥都炸'],
            service: ['态度恶劣，没法沟通', '服务一般，有些机车', '稍有服务，态度积极', '比较专业服务，有特色', '专业服务，体验极佳']
        };
        document.addEventListener('DOMContentLoaded', () => {
            initNickname();
            updateSummary();
            document.getElementById('description').addEventListener('input', function() {
                document.getElementById('descCount').textContent = this.value.length;
            });
            document.getElementById('shortcoming').addEventListener('input', updateSummary);
            const syncList = [
                ['teacherId','teacherIdMobile'],
                ['teacherName','teacherNameMobile'],
                ['age','ageMobile'],
                ['price','priceMobile'],
                ['height','heightMobile'],
                ['weight','weightMobile'],
                ['bust','bustMobile']
            ];
            syncList.forEach(([pcId,mId])=>{
                const pcEl = document.getElementById(pcId);
                const mEl = document.getElementById(mId);
                pcEl.addEventListener('input',()=>{ mEl.value = pcEl.value; });
                mEl.addEventListener('input',()=>{ pcEl.value = mEl.value; });
                if(pcEl.tagName==='SELECT') pcEl.addEventListener('change',()=>{ mEl.value = pcEl.value; });
                if(mEl.tagName==='SELECT') mEl.addEventListener('change',()=>{ pcEl.value = mEl.value; });
            });
        });
        function initNickname() {
            const saved = localStorage.getItem('evaluatornickname');
            if (saved) {
                state.nickname = saved;
            } else {
                state.nickname = '用户' + Math.floor(Math.random() * 10000);
                localStorage.setItem('evaluatornickname', state.nickname);
            }
            document.getElementById('nickname-display').textContent = state.nickname;
        }
        function showNicknameModal() {
            document.getElementById('nicknameInput').value = state.nickname;
            document.getElementById('nicknameModal').classList.remove('hidden');
        }
        function closeNicknameModal() {
            document.getElementById('nicknameModal').classList.add('hidden');
        }
        function saveNickname() {
            const newNick = document.getElementById('nicknameInput').value.trim();
            if (newNick) {
                state.nickname = newNick;
                localStorage.setItem('evaluatornickname', newNick);
                document.getElementById('nickname-display').textContent = newNick;
                closeNicknameModal();
                showToast('昵称已保存', 'success');
            }
        }
        function updateScore(type, value) {
            state.scores[type] = parseFloat(value);
            const displayValue = (parseFloat(value) * 2).toFixed(0);
            document.getElementById(type + 'Value').textContent = displayValue + '分';
            const index = Math.min(Math.floor(parseFloat(value) - 0.5), 4);
            document.getElementById(type + 'Desc').textContent = scoreDescs[type][index];
            updateSummary();
        }
        function calculateScore() {
            const look10 = state.scores.look * 2;
            const breast10 = state.scores.breast * 2;
            const figure10 = state.scores.figure * 2;
            const service10 = state.scores.service * 2;
            const base = (look10 + breast10 + figure10 + service10) / 4;
            let extra = 0;
            const bust = getVal('bust','bustMobile');
            if (bust === 'A' || bust === 'A-') extra -= 0.4;
            else if (bust === 'B-' || bust === 'A+') extra -= 0.2;
            if (getVal('shortcoming','')?.trim()) extra -= 0.2;
            const final = Math.max(0, base + extra);
            return { base, extra, final, look10, breast10, figure10, service10 };
        }
        function updateSummary() {
            const { base, extra, final } = calculateScore();
            document.getElementById('baseScore').textContent = base.toFixed(2);
            document.getElementById('extraScore').textContent = (extra >= 0 ? '+' : '') + extra.toFixed(1);
            document.getElementById('finalScore').textContent = final.toFixed(2);
        }
        function generateReport() {
            const teacherId = getVal('teacherId','teacherIdMobile');
            const teacherName = getVal('teacherName','teacherNameMobile');
            const age = getVal('age','ageMobile');
            const height = getVal('height','heightMobile');
            const weight = getVal('weight','weightMobile');
            const price = getVal('price','priceMobile');
            const bust = getVal('bust','bustMobile');
            const shortcoming = getVal('shortcoming','');
            const description = document.getElementById('description').value;
            const { final, look10, breast10, figure10, service10 } = calculateScore();
            const lookDesc = document.getElementById('lookDesc').textContent;
            const breastDesc = document.getElementById('breastDesc').textContent;
            const figureDesc = document.getElementById('figureDesc').textContent;
            const serviceDesc = document.getElementById('serviceDesc').textContent;

            return `【老师测评报告】
━━━━━━━
基本信息
· 老师ID：${teacherId}
· 老师姓名：${teacherName}
· 年龄：${age}岁
· 身高：${height}cm
· 体重：${weight}kg
· 单价：${price}
· 胸围：${bust}
基础评分（10分制）：
· 颜值：${look10}/10 【${lookDesc}】
· 胸型：${breast10}/10 【${breastDesc}】
· 身材：${figure10}/10 【${figureDesc}】
· 服务：${service10}/10 【${serviceDesc}】
最终得分：${final.toFixed(2)}分
不足之处：
${shortcoming || '无'}
详细描述：
${description}
━━━━━━━
报告填写地址：https://bycby88.github.io/ZSFK/
测评人：${state.nickname}`;
        }
        async function submitToAPI() {
            const API_URL = 'https://cp.byg88.biz/api/collections/measured_scores/records';
            const bust = getVal('bust','bustMobile');
            const { final, look10, breast10, figure10, service10 } = calculateScore();
            const requestBody = {
                evaluator: state.nickname,
                teacher_id: getVal('teacherId','teacherIdMobile'),
                teacher_name: getVal('teacherName','teacherNameMobile'),
                age: getVal('age','ageMobile') ? parseInt(getVal('age','ageMobile')) : null,
                height: getVal('height','heightMobile') ? parseInt(getVal('height','heightMobile')) : null,
                weight: getVal('weight','weightMobile') ? parseFloat(getVal('weight','weightMobile')) : null,
                price: getVal('price','priceMobile') ? parseInt(getVal('price','priceMobile')) : null,
                bust: bust || null,
                score_look: look10,
                score_breast: breast10,
                score_figure: figure10,
                score_service: service10,
                final_score: final,
                shortcoming: getVal('shortcoming','')?.trim() || null,
                description: document.getElementById('description').value.trim()
            };
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const resJson = await response.json();
                if (!response.ok) {
                    showToast(resJson.error || '提交失败', 'error');
                    console.error('API 提交失败:', resJson);
                    return false;
                }
                showToast('数据已提交服务器','success');
                console.log('API 提交成功',resJson);
                return true;
            } catch (err) {
                showToast('网络异常，提交失败','error');
                console.error('API 提交错误:', err);
                return false;
            }
        }
        async function handleSubmit(e) {
            e.preventDefault();
            showToast("正在校验表单...","success");
            const report = generateReport();
            try {
                await safeCopy(report);
                showToast('报告已复制到剪贴板', 'success');
            } catch (err) {
                showToast('复制失败，请手动复制', 'error');
            }
            const ok = await submitToAPI();
            if(ok){
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('testForm').reset();
                state.scores = { look: 3, breast: 3, figure: 3, service: 3 };
                ['look', 'breast', 'figure', 'service'].forEach(type => {
                    document.getElementById(type).value = 3;
                    document.getElementById(type+'Value').textContent = '6分';
                    document.getElementById(type+'Desc').textContent = scoreDescs[type][2];
                });
                document.getElementById('descCount').textContent = '0';
                updateSummary();
            }
        }
        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
        async function copyAgain() {
            try {
                await safeCopy(generateReport());
                showToast('已复制', 'success');
            } catch (err) {
                showToast('复制失败', 'error');
            }
        }
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
</script>
</body>
</html>
